# Experimental: the API may block GitHub runners. Delete this workflow if its first manual run meets a security challenge.
name: API tests (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npx playwright test --project=api --reporter=list,html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
